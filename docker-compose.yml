services:
  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    depends_on:
      - app

  app:
    image: node:22-alpine
    working_dir: /app
    command: ["node", "-e", "require('http').createServer((_, res) => res.end('ok')).listen(3000)"]
    environment:
      DATABASE_URL: postgres://demo:demo@db:5432/demo
      REDIS_URL: redis://cache:6379
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started

  worker:
    image: node:22-alpine
    command: ["sh", "-c", "while true; do echo 'processing jobs'; sleep 30; done"]
    environment:
      DATABASE_URL: postgres://demo:demo@db:5432/demo
      REDIS_URL: redis://cache:6379
    depends_on:
      - db
      - cache

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo"]
      interval: 5s
      timeout: 3s
      retries: 5

  cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  db-data:
